<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  
<title>PLDC Quiz — Pháp Luật Đại Cương</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap');

  
  :root {
    --bg:  #0f1117;
    --surface: #1a1d27;
    --surface2:  #22263a;
    --border: #2e3350;
    --accent: #6c63ff;
    --accent2: #ff6b9d;
    --green: #22d3a5;
    --red: #ff5c6a;
    --yellow: #ffd166;
    --text: #e8eaf6;
    --muted: #8890b0;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Be Vietnam Pro', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
  }

  /* ===== HEADER ===== */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo { font-family: 'Space Mono', monospace; font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: 1px; }
  .logo span { color: var(--accent2); }
  .header-stats { display: flex; gap: 16px; font-size: 13px; color: var(--muted); }
  .header-stats b { color: var(--text); }

  /* ===== MAIN LAYOUT ===== */
  .container { max-width: 860px; margin: 0 auto; padding: 24px 16px 60px; }

  /* ===== HOME / CHAPTER SELECT ===== */
  .home-title { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
  .home-sub { color: var(--muted); margin-bottom: 28px; font-size: 14px; }
  .chapter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .chapter-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    cursor: pointer;
    transition: all .2s;
    position: relative;
    overflow: hidden;
  }
  .chapter-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 30px rgba(108,99,255,.15); }
  .chapter-card.selected { border-color: var(--accent); background: rgba(108,99,255,.08); }
  .chapter-card h3 { font-size: 13px; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
  .chapter-card p { font-size: 13px; color: var(--muted); line-height: 1.4; }
  .chapter-card .c-count {
    position: absolute; top: 12px; right: 14px;
    font-family: 'Space Mono', monospace;
    font-size: 11px; font-weight: 700;
    color: var(--accent2); background: rgba(255,107,157,.1);
    padding: 2px 7px; border-radius: 20px;
  }
  .chapter-progress { height: 3px; background: var(--border); border-radius: 2px; margin-top: 10px; }
  .chapter-progress-fill { height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 2px; transition: width .4s; }

  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 11px 22px; border-radius: 10px; border: none; cursor: pointer;
    font-family: 'Be Vietnam Pro', sans-serif; font-size: 14px; font-weight: 600;
    transition: all .2s; text-decoration: none;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #5a52ee; box-shadow: 0 4px 20px rgba(108,99,255,.4); }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger { background: rgba(255,92,106,.15); color: var(--red); border: 1px solid rgba(255,92,106,.25); }
  .btn-danger:hover { background: rgba(255,92,106,.25); }
  .btn-yellow { background: rgba(255,209,102,.15); color: var(--yellow); border: 1px solid rgba(255,209,102,.25); }
  .btn-sm { padding: 7px 14px; font-size: 13px; }

  .action-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; }

  /* ===== QUIZ MODE ===== */
  .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .quiz-info { font-size: 13px; color: var(--muted); }
  .quiz-info b { color: var(--text); }
  .progress-bar { height: 5px; background: var(--border); border-radius: 3px; margin-bottom: 28px; }
  .progress-bar-fill { height: 5px; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 3px; transition: width .3s; }

  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 28px;
    margin-bottom: 20px;
    animation: fadeIn .25s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .q-num { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--accent); font-weight: 700; margin-bottom: 10px; letter-spacing: 1px; }
  .q-text { font-size: 16px; font-weight: 600; line-height: 1.65; margin-bottom: 24px; }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 11px;
    padding: 14px 18px;
    cursor: pointer;
    display: flex; align-items: flex-start; gap: 12px;
    transition: all .18s;
    font-size: 14px; line-height: 1.55;
  }
  .option:hover:not(.disabled) { border-color: var(--accent); background: rgba(108,99,255,.08); }
  .option.correct { border-color: var(--green); background: rgba(34,211,165,.1); }
  .option.wrong { border-color: var(--red); background: rgba(255,92,106,.1); }
  .option.disabled { cursor: default; }
  .opt-letter {
    min-width: 26px; height: 26px; border-radius: 7px;
    background: var(--border); display: flex; align-items: center; justify-content: center;
    font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; color: var(--muted);
    transition: all .18s; flex-shrink: 0; margin-top: 1px;
  }
  .option.correct .opt-letter { background: var(--green); color: #000; }
  .option.wrong .opt-letter { background: var(--red); color: #fff; }
  .option:hover:not(.disabled) .opt-letter { background: var(--accent); color: #fff; }

  .feedback-box {
    margin-top: 18px; padding: 14px 18px;
    border-radius: 11px; font-size: 14px; line-height: 1.55;
    display: none;
  }
  .feedback-box.correct { background: rgba(34,211,165,.1); border: 1px solid rgba(34,211,165,.3); color: var(--green); }
  .feedback-box.wrong { background: rgba(255,92,106,.1); border: 1px solid rgba(255,92,106,.3); color: #ff8c96; }

  .quiz-actions { display: flex; gap: 10px; flex-wrap: wrap; }

  /* ===== FLAGS ===== */
  .flag-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .flag-btn {
    padding: 5px 12px; border-radius: 20px; border: 1.5px solid var(--border);
    background: transparent; color: var(--muted); font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all .15s;
    font-family: 'Be Vietnam Pro', sans-serif;
  }
  .flag-btn.active-unsure { border-color: var(--yellow); color: var(--yellow); background: rgba(255,209,102,.1); }
  .flag-btn.active-marked { border-color: var(--accent2); color: var(--accent2); background: rgba(255,107,157,.1); }

  /* ===== EXAM MODE ===== */
  .exam-setup {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 28px;
    max-width: 480px;
  }
  .exam-setup h2 { font-size: 20px; margin-bottom: 18px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .form-group select, .form-group input {
    width: 100%; padding: 10px 14px;
    background: var(--surface2); border: 1.5px solid var(--border); border-radius: 9px;
    color: var(--text); font-family: 'Be Vietnam Pro', sans-serif; font-size: 14px;
    transition: border .15s;
  }
  .form-group select:focus, .form-group input:focus { outline: none; border-color: var(--accent); }

  /* ===== EXAM RESULTS ===== */
  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 32px;
    text-align: center;
    margin-bottom: 24px;
  }
  .result-score { font-family: 'Space Mono', monospace; font-size: 56px; font-weight: 700; line-height: 1; }
  .result-score.pass { color: var(--green); }
  .result-score.fail { color: var(--red); }
  .result-label { color: var(--muted); font-size: 14px; margin-top: 6px; margin-bottom: 20px; }
  .result-stats { display: flex; justify-content: center; gap: 32px; font-size: 14px; }
  .result-stats .stat b { display: block; font-size: 22px; font-family: 'Space Mono', monospace; }
  .result-stats .stat span { color: var(--muted); font-size: 12px; }

  /* ===== NAV TABS ===== */
  .nav-tabs { display: flex; gap: 4px; background: var(--surface); border-radius: 12px; padding: 4px; margin-bottom: 24px; width: fit-content; }
  .nav-tab {
    padding: 9px 18px; border-radius: 9px; border: none; background: transparent;
    color: var(--muted); font-family: 'Be Vietnam Pro', sans-serif; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all .15s;
  }
  .nav-tab.active { background: var(--accent); color: #fff; }

  /* ===== FILTER BAR ===== */
  .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
  .filter-chip {
    padding: 5px 12px; border-radius: 20px;
    border: 1.5px solid var(--border); background: transparent;
    color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer;
    font-family: 'Be Vietnam Pro', sans-serif; transition: all .15s;
  }
  .filter-chip.active { border-color: var(--accent); color: var(--accent); background: rgba(108,99,255,.1); }
  .filter-count { font-size: 12px; color: var(--muted); margin-left: auto; }

  /* ===== TOAST ===== */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--surface2); border: 1px solid var(--border);
    padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 600;
    transition: transform .3s; z-index: 999; white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ===== TIMER ===== */
  .timer-badge {
    font-family: 'Space Mono', monospace; font-size: 14px; font-weight: 700;
    background: var(--surface2); border: 1.5px solid var(--border);
    padding: 6px 14px; border-radius: 8px; color: var(--text);
  }
  .timer-badge.urgent { border-color: var(--red); color: var(--red); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.5} }

  /* ===== SCROLLBAR ===== */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ===== EMPTY STATE ===== */
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty .icon { font-size: 48px; margin-bottom: 12px; }
  .empty p { font-size: 15px; }

  @media(max-width:600px) {
    .question-card { padding: 18px; }
    .q-text { font-size: 15px; }
    .result-stats { gap: 16px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">PLDC<span>.</span>quiz</div>
  <div class="header-stats" id="headerStats">Chọn chương để bắt đầu</div>
</div>

<div class="container" id="app"></div>
<div class="toast" id="toast"></div>

<script>
// ============================================================
// DATA: 430 CÂU HỎI
// ============================================================
const QUESTIONS = [
{id:1,q:"Nhà nước do giai cấp thống trị lập nên để bảo vệ quyền và lợi ích của giai cấp mình là quan điểm của học thuyết?",o:["Mác - Lênin","Thần học","Gia trưởng","Khế ước xã hội"],a:0},
{id:2,q:"Theo quan điểm của chủ nghĩa Mác-Lênin thì nguyên nhân chủ yếu làm xuất hiện Nhà nước là?",o:["Do có sự phân hóa lao động trong xã hội","Do có sự phân hóa giai cấp và đấu tranh giai cấp trong xã hội","Do địa hình, khí hậu không thuận lợi nên con người phải hợp sức lại để phát triển sản xuất","Do các thành viên trong xã hội lập ra"],a:1},
{id:3,q:"Nhà nước chưa ra đời trong hình thái kinh tế - xã hội nào sau đây?",o:["Hình thái kinh tế - xã hội Công xã nguyên thủy","Hình thái kinh tế - xã hội Cộng sản nguyên thủy","Hình thái kinh tế - xã hội Cộng sản chủ nghĩa","Hình thái kinh tế - xã hội Chiếm hữu nô lệ"],a:1},
{id:4,q:"Nước nào sau đây có hình thức cấu trúc nhà nước liên bang?",o:["Việt Nam","Pháp","Nga","Xingapo"],a:2},
{id:5,q:"Nhà nước nào sau đây có hình thức cấu trúc là nhà nước đơn nhất?",o:["Mêxicô","Thụy Sĩ","Việt Nam","Nga"],a:2},
{id:6,q:"Nhà nước CHXHCN Việt Nam có hình thức cấu trúc là?",o:["Nhà nước đơn nhất","Nhà nước liên bang","Nhà nước liên minh","Nhà nước độc tài"],a:0},
{id:7,q:"Nhà nước nào sau đây có hình thức chính thể cộng hòa tổng thống?",o:["Đức","Ấn Độ","Anh","Tất cả đều sai"],a:3},
{id:8,q:"Nhà nước là hiện tượng xã hội mang tính lịch sử, đây là khẳng định về nguồn gốc của nhà nước theo quan điểm của…?",o:["Aristote","J.J.Rousseau","Plato","Chủ nghĩa Mác-Lênin"],a:3},
{id:9,q:"Tổ chức thị tộc trong xã hội Cộng sản nguyên thủy là?",o:["Một tổ chức kinh tế","Một tập đoàn người có cùng quan hệ huyết thống","Một xã hội độc lập","Một đơn vị độc lập"],a:1},
{id:10,q:"Kiểu nhà nước đầu tiên trong lịch sử xã hội loài người là?",o:["Nhà nước cộng sản nguyên thủy","Nhà nước phong kiến","Nhà nước chủ nô","Nhà nước tư sản"],a:2},
{id:11,q:"Quyền hành pháp được hiểu là?",o:["Quyền ban hành và triển khai thực hiện pháp luật","Quyền ban hành pháp luật","Quyền tổ chức thực hiện pháp luật","Quyền bảo vệ pháp luật"],a:2},
{id:12,q:"Tổ chức nào có quyền phân chia lãnh thổ thành các đơn vị hành chính?",o:["Đảng cộng sản","Mặt trận Tổ quốc","Công đoàn","Nhà nước"],a:3},
{id:13,q:"Kiểu nhà nước mà trong đó giai cấp thống trị chiếm đa số trong xã hội là…",o:["Chủ nô","Phong kiến","Tư sản","Xã hội chủ nghĩa"],a:3},
{id:14,q:"Cách thức và trình tự thành lập ra các cơ quan quyền lực tối cao của nhà nước, đó là",o:["Hình thức chính thể","Hình thức cấu trúc nhà nước","Chế độ chính trị","Hình thức nhà nước"],a:0},
{id:15,q:"Người ở độ tuổi phải chịu trách nhiệm hình sự về tội phạm rất nghiêm trọng do cố ý hoặc tội phạm đặc biệt nghiêm trọng là…",o:["từ đủ 14 đến dưới 16","từ 14 đến đủ 16","từ đủ 16 đến dưới 18","từ 16 đến đủ 18"],a:0},
{id:16,q:"Trách nhiệm pháp lý được áp dụng đối với người vi phạm pháp luật nhằm…",o:["giáo dục, răn đe, hành hạ","buộc chủ thể vi phạm pháp luật chấm dứt hành vi trái pháp luật","xử phạt hành chính","phạt tù hoặc tử hình"],a:1},
{id:17,q:"Vi phạm pháp luật hành chính là hành vi vi phạm pháp luật, xâm phạm tới…",o:["quan hệ xã hội và quan hệ kinh tế","các quy tắc quản lý nhà nước","các điều luật và các quan hệ hành chính","quan hệ xã hội và quan hệ hành chính"],a:1},
{id:18,q:"Nhà nước nào sau đây có chính thể cộng hòa đại nghị?",o:["Đức","Bồ Đào Nha","Hoa Kỳ","Việt Nam"],a:0},
{id:19,q:"Nhà nước quân chủ hạn chế (quân chủ lập hiến) là nhà nước…?",o:["Quyền lực nhà nước tối cao thuộc về một cơ quan tập thể và được hình thành theo phương thức thừa kế và một cơ quan nhà nước khác","Quyền lực nhà nước tối cao thuộc về một cơ quan tập thể do bầu cử mà ra","Quyền lực nhà nước được phân chia cho người đứng đầu nhà nước theo phương thức thừa kế","Quyền lực nhà nước thuộc về một tập thể gồm những người quý tộc và được hình thành do thừa kế"],a:2},
{id:20,q:"Trong nhà nước quân chủ chuyên chế thì…",o:["Quyền lực nhà nước tối cao thuộc về một một cơ quan tập thể và do bầu cử mà ra","Quyền lực nhà nước tối cao thuộc về một người và được hình thành do bầu cử","Quyền lực nhà nước thuộc về một người và được hình thành theo phương thức thừa kế","Quyền lực nhà nước thuộc về một tập thể, được hình thành theo phương thức thừa kế"],a:2},
{id:21,q:"Nhà nước quân chủ là nhà nước…",o:["Quyền lực nhà nước tối cao tập trung vào người đứng đầu nhà nước và được hình thành do bầu cử","Quyền lực nhà nước tối cao thuộc về người đứng đầu nhà nước hay thuộc về một tập thể, và được hình thành do bầu cử","Quyền lực nhà nước tối cao tập trung toàn bộ hay một phần chủ yếu vào tay người đứng đầu nhà nước theo nguyên tắc thừa kế","Tất cả đều sai"],a:2},
{id:22,q:"Hình thức cấu trúc nhà nước đơn nhất có đặc điểm…",o:["Một hệ thống pháp luật","Hai hệ thống cơ quan Nhà nước","Lãnh thổ có chủ quyền riêng","Hai hệ thống pháp luật"],a:0},
{id:23,q:"Khi nghiên cứu về tổ chức thị tộc thì khẳng định nào sau đây là đúng?",o:["Thị tộc là nhà nước trong xã hội Cộng sản nguyên thủy","Trong thị tộc đã có sự phân công lao động chuyên môn hóa ngành nghề","Thị tộc là đơn vị kinh tế đầu tiên của xã hội cộng sản nguyên thủy","Tổ chức thị tộc gắn liền xã hội có giai cấp"],a:2},
{id:24,q:"Chọn phương án đúng nhất: Tính giai cấp của nhà nước thể hiện ở phương diện nào?",o:["kinh tế, chính trị, xã hội","kinh tế, chính trị, tư tưởng","kinh tế, văn hóa, xã hội","kinh tế, chính trị, văn hóa"],a:1},

{id:75,q:"Trong các nghĩa vụ sau đây nghĩa vụ nào KHÔNG phải là nghĩa vụ pháp lý?",o:["Đoàn viên thanh niên phải chấp hành điều lệ của Đoàn","Người kinh doanh phải thực hiện nghĩa vụ nộp thuế","Thanh niên đủ 18 tuổi phải thực hiện nghĩa vụ quân sự","Con cái có nghĩa vụ phụng dưỡng cha mẹ già"],a:0},
{id:76,q:"Hình thức pháp luật có tính rõ ràng, cụ thể, được ban hành theo trình tự, thủ tục nhất định và ngày càng được sử dụng rộng rãi ở các quốc gia, đó là?",o:["Tiền lệ pháp","Tập quán pháp","Văn bản luật","Văn bản quy phạm pháp luật"],a:3},
{id:77,q:"Anh A lái xe máy và lưu thông đúng luật. Chị B đi xe đạp không quan sát và bất ngờ băng ngang qua đường làm anh A bị thương (giám định là 10%). Trường hợp này xử phạt như thế nào?",o:["Cảnh cáo và buộc chị B phải bồi thường thiệt hại cho gia đình anh A","Cảnh cáo phạt tiền chị B","Không xử lý chị B vì chị B là người đi xe đạp","Phạt tù chị B"],a:0},
{id:78,q:"Chọn phương án đúng nhất: Một trong những đặc điểm để phân biệt pháp luật với quy phạm đạo đức là:",o:["Pháp luật có tính quyền lực, bắt buộc chung","Pháp luật có tính quyền lực","Pháp luật có tính bắt buộc chung","Pháp luật có tính quy phạm"],a:0},
{id:79,q:"Pháp luật là phương tiện để công dân:",o:["Sống tự do, dân chủ","Thực hiện và bảo vệ quyền, lợi ích hợp pháp của mình","Quyền con người được tôn trọng và bảo vệ","Công dân phát triển toàn diện"],a:1},
{id:80,q:"Quản lí bằng pháp luật là phương pháp quản lí…",o:["hữu hiệu và phức tạp nhất","dân chủ và hiệu quả nhất","hiệu quả và khó khăn nhất","dân chủ và cứng rắn nhất"],a:1},
{id:81,q:"Bộ phận đảm bảo cho quy phạm pháp luật được thực hiện nghiêm chỉnh là…?",o:["Quy định","Giả định","Chế tài","Quy cách"],a:2},
{id:82,q:"Thời điểm năng lực pháp luật và năng lực hành vi của pháp nhân được nhà nước công nhận là:",o:["Cùng một thời điểm","Năng lực pháp luật được công nhận trước năng lực hành vi","Năng lực hành vi được công nhận trước năng lực pháp luật","Tất cả đều đúng"],a:0},
{id:83,q:"Nội dung của quan hệ pháp luật là:",o:["Quyền và nghĩa vụ của các chủ thể trong quan hệ pháp luật","Những giá trị mà các chủ thể quan hệ pháp luật muốn đạt được","Là các bên tham gia vào quan hệ pháp luật","Là đối tượng mà các chủ thể quan tâm khi tham gia vào quan hệ pháp luật"],a:0},
{id:84,q:"Khi nào pháp nhân có năng lực chủ thể:",o:["Khi nhà nước cho phép hoặc công nhận sự thành lập của pháp nhân","Khi tổ chức có đủ số thành viên","Khi các thành viên thỏa thuận thành lập pháp nhân","Khi một tổ chức có đủ vốn"],a:0},
{id:85,q:"Khả năng của chủ thể bằng chính hành vi của mình thực hiện được các quyền và nghĩa vụ mà pháp luật quy định, đó là:",o:["Năng lực pháp luật","Năng lực hành vi","Năng lực chủ thể","Tất cả đều đúng"],a:1},

{id:89,q:"Tiêu chuẩn xác định một hệ thống pháp luật hoàn thiện là?",o:["Tính toàn diện, tính đồng bộ","Tính phù hợp","Trình độ kỹ thuật pháp lý cao","Tất cả đều đúng"],a:3},
{id:90,q:"Chọn phương án đúng nhất: Năng lực hành vi của cá nhân chỉ xuất hiện khi?",o:["Cá nhân đủ 18 tuổi, không mắc bệnh tâm thần","Cá nhân đủ 16 tuổi, có trí óc bình thường","Cá nhân đã đến độ tuổi nhất định và có những điều kiện nhất định","Được nhà nước quy định"],a:2},
{id:91,q:"Một tổ chức có tư cách pháp nhân khi có điều kiện?",o:["Được thành lập hợp pháp, có cơ cấu tổ chức chặt chẽ","Có tài sản độc lập với cá nhân, tổ chức khác","Nhân danh mình tham gia các quan hệ pháp luật một cách độc lập","Tất cả đều đúng"],a:3},
{id:92,q:"Các quy phạm pháp luật bắt nguồn từ đâu?",o:["Từ tư duy trừu tượng của con người","Từ quyền lực của giai cấp thống trị","Từ thực tiễn đời sống xã hội, do thực tiễn cuộc sống đòi hỏi","Từ ý thức của các cá nhân trong xã hội"],a:2},
{id:93,q:"'Pháp luật là của ai, do ai và vì ai?' Đề cập đến vấn đề nào của pháp luật?",o:["Nội dung của pháp luật","Hình thức thể hiện của pháp luật","Khái niệm cơ bản của pháp luật","Bản chất của pháp luật"],a:3},
{id:94,q:"Cá nhân có năng lực hành vi đầy đủ khi:",o:["Từ đủ 15 tuổi trở lên","Từ đủ 21 tuổi trở lên","Từ đủ 18 tuổi trở lên","Từ đủ 6 tuổi trở lên"],a:2},

{id:99,q:"Điền từ vào chỗ trống: 'Pháp luật là hệ thống quy tắc xử sự mang tính ............., do............ ban hành và bảo đảm thực hiện, thể hiện ................. của giai cấp thống trị và phụ thuộc vào các điều kiện ...............''",o:["Bắt buộc – quốc hội – ý chí – chính trị","Bắt buộc chung – nhà nước – lý tưởng – chính trị","Bắt buộc – quốc hội – lý tưởng – kinh tế xã hội","Bắt buộc chung – nhà nước – ý chí – kinh tế xã hội"],a:3},
{id:100,q:"Chọn phương án đúng nhất: Nói đến vai trò của pháp luật đối với sự phát triển bền vững của đất nước là nói đến sự tác động của pháp luật đối với…",o:["Các lĩnh vực của đời sống xã hội","Lĩnh vực bảo vệ môi trường","Việc xây dựng và bảo vệ đất nước","Phát triển kinh tế đất nước"],a:0},
{id:101,q:"Hành vi tổ chức đánh bạc của công chức, viên chức nhà nước bị công an bắt quả tang được xác định là hành vi:",o:["Vi phạm hình sự","Vi phạm công vụ","Vi phạm kỷ luật","Vi phạm dân sự"],a:0},
{id:102,q:"Xác định phương án SAI: Khi phát sinh tranh chấp về quyền và nghĩa vụ giữa các chủ thể thì…",o:["Các chủ thể không có quyền tự giải quyết tranh chấp","Các chủ thể có thể nhờ người hòa giải","Các chủ thể có thể thỏa thuận với nhau về cách giải quyết tranh chấp","Các chủ thể có quyền yêu cầu nhà nước giải quyết"],a:0},

{id:104,q:"Ông B tổ chức buôn ma túy, hỏi ông B phải chịu trách nhiệm pháp lý nào?",o:["Trách nhiệm hành chính","Trách nhiệm hình sự","Trách nhiệm dân sự","Trách nhiệm kỷ luật"],a:1},
{id:105,q:"Chế tài nào sau đây chỉ do Tòa án áp dụng:",o:["Chế tài hành chính","Chế tài hình sự","Chế tài kỷ luật","Chế tài công vụ"],a:1},

{id:107,q:"Điền vào chỗ trống: Chủ thể vi phạm pháp luật là cá nhân hoặc tổ chức có ...... đã thực hiện hành vi vi phạm pháp luật?",o:["Khả năng","Năng lực hành vi","Năng lực trách nhiệm pháp lý","Năng lực pháp luật"],a:3},
{id:108,q:"Trường hợp nào sau đây thì mới được bắt, giam, giữ người",o:["Bắt người khi đang bị tình nghi có hành vi vi phạm pháp luật","Bắt người phạm tội quả tang hoặc đang bị truy nã","Bắt, giam, giữ người khi người này đang nghiện ma tuý","Bắt giam người khi người này có người thân phạm pháp luật"],a:1},
{id:109,q:"Ở Việt Nam, cứ đến ngày Quốc khánh (2/9) người nào cải tạo tốt, biết hối cải thì được Chủ tịch nước ân xá cho ra tù trước thời hạn. Thể hiện bản chất nào của pháp luật?",o:["Bản chất giai cấp","Bản chất xã hội","Bản chất nhân đạo sâu sắc pháp luật xã hội chủ nghĩa","Bản chất nhân dân"],a:2},
{id:110,q:"Chọn phương án đúng nhất: Phương thức tác động của nhà nước lên quan hệ pháp luật là…",o:["giáo dục, thuyết phục và cưỡng chế","giáo dục, cưỡng chế","Cưỡng chế","giáo dục"],a:0},
{id:111,q:"Lệnh là văn bản quy phạm pháp luật do cơ quan nào sau đây ban hành?",o:["Thủ tướng Chính phủ","Chủ tịch Quốc hội","Tổng Bí thư","Chủ tịch nước"],a:3},
{id:112,q:"Khẳng định nào SAI khi nghiên cứu về mặt chủ quan của vi phạm pháp luật?",o:["Động cơ là cái thúc đẩy chủ thể thực hiện hành vi vi phạm pháp luật","Lỗi là một trong những căn cứ để xác định mức độ trách nhiệm pháp lý đối với chủ thể vi phạm pháp luật","Lỗi là thái độ tâm lý của chủ thể đối với hành vi trái pháp luật mà mình đã thực hiện và hậu quả do hành vi gây ra","Chỉ khi nào hành vi trái pháp luật được chủ thể thực hiện một cách cố ý thì mới có thể là hành vi vi phạm pháp luật"],a:3},
{id:113,q:"Những biểu hiện, diễn biến tâm lý bên trong của chủ thể vi phạm pháp luật gọi là?",o:["Mặt chủ quan của vi phạm pháp luật","Nhận thức, thái độ của chủ thể","Chủ thể vi phạm pháp luật","Tất cả đều đúng"],a:0},
{id:114,q:"Khi nghiên cứu về chủ thể quan hệ pháp luật thì khẳng định nào sau đây là đúng?",o:["Tất cả mọi cá nhân đều có thể trở thành chủ thể của quan hệ pháp luật","Tất cả mọi tổ chức đều có thể trở thành chủ thể của quan hệ pháp luật","Tất cả mọi cá nhân và tổ chức có đủ những điều kiện do pháp luật quy định đều có thể trở thành chủ thể của quan hệ pháp luật","Tất cả các cơ quan, đơn vị, tổ chức và cá nhân trong xã hội đều có thể trở thành chủ thể của quan hệ pháp luật"],a:2},
{id:115,q:"A đánh B gây thương tích 15%, theo Bộ luật hình sự năm 2015 sửa đổi bổ sung năm 2017 thì A phải chịu hình phạt nào?",o:["Răn đe, giáo dục","Bồi thường thiệt hại","Phạt tù","Tạm giữ để giáo dục"],a:2},
{id:116,q:"Các quyền và nghĩa vụ pháp lý cơ bản của công dân được qui định trong…",o:["Luật hành chính","Luật hôn nhân - gia đình","Luật dân sự","Hiến pháp"],a:3},
{id:117,q:"Chủ thể có năng lực trách nhiệm pháp lý khi có đủ điều kiện sau?",o:["Từ 18 tuổi trở lên và có trí óc bình thường","Đạt độ tuổi do pháp luật quy định, có năng lực pháp luật","Có năng lực pháp luật và năng lực hành vi","Đạt độ tuổi do pháp luật quy định, có khả năng nhận thức và điều khiển hành vi"],a:3},
{id:118,q:"Khi nghiên cứu về quyền chủ thể trong quan hệ pháp luật, thì khẳng định nào sau đây là ĐÚNG?",o:["Khả năng được lựa chọn những xử sự theo ý muốn chủ quan của mình","Khả năng yêu cầu các chủ thể khác thực hiện nghĩa vụ để bảo đảm việc thực hiện quyền của mình","Khả năng yêu cầu cơ quan Nhà nước có thẩm quyền bảo vệ quyền của mình khi bị phía chủ thể bên kia vi phạm","Tất cả đều đúng"],a:3},
{id:119,q:"Nhận định nào sau đây SAI khi nói đến vai trò của pháp luật…",o:["Pháp luật là phương tiện để Nhà nước quản lý mọi mặt đời sống xã hội","Pháp luật là phương tiện thực hiện và bảo vệ quyền, lợi ích hợp pháp của mỗi công dân","Pháp luật là công cụ thực hiện đường lối chính sách của Đảng","Pháp luật là công cụ bảo vệ mọi quyền và lợi ích của mọi công dân"],a:3},
{id:120,q:"Nội dung nào sau đây phù hợp với tính quy phạm và phổ biến của pháp luật? (câu 120)",o:["Phạm vi tác động của quy phạm xã hội rộng hơn so với pháp luật","Ai cũng cần phải thực hiện theo các tín điều tôn giáo được ban hành","Cơ quan có quyền ban hành pháp luật thì cũng có quyền không thực hiện pháp luật","Phạm vi tác động của pháp luật rộng lớn cả về không gian, thời gian và đối tượng áp dụng"],a:3},
{id:121,q:"Ưu thế vượt trội của pháp luật so với các quy phạm xã hội khác là? (câu 121)",o:["Tính cưỡng chế","Tính rộng rãi","Tồn tại trong thời gian dài","Tính xã hội"],a:0},
{id:122,q:"Nghĩa vụ pháp lý của chủ thể gồm có?",o:["Chủ thể phải tiến hành một số hành vi nhất định do pháp luật quy định","Chủ thể phải tự kiềm chế, không được thực hiện một số hành vi nhất định","Chủ thể phải chịu trách nhiệm pháp lý khi không thực hiện theo cách xử sự bắt buộc mà pháp luật đã quy định","Tất cả đều đúng"],a:3},
{id:123,q:"Trong các yếu tố cấu thành hệ thống pháp luật, yếu tố được xem là đơn vị cơ bản nhỏ nhất trong hệ thống pháp luật là:",o:["Quy phạm pháp luật","Chế định pháp luật","Ngành luật","Tất cả đếu đúng"],a:0},

{id:177,q:"Chọn phương án đúng nhất: Cấu thành của vi phạm pháp luật bao gồm:",o:["Giả định, quy định, chế tài","Chủ thể, khách thể","Mặt chủ quan, mặt khách quan","Chủ thể, khách thể, mặt chủ quan, mặt khách quan"],a:3},

{id:188,q:"Trong quy phạm pháp luật về quảng cáo gian dối, bộ phận giả định là…",o:["Người nào quảng cáo gian dối về hàng hóa về dịch vụ","Người nào quảng cáo gian dối về hàng hóa dịch vụ gây hậu quả nghiêm trọng","Người nào quảng cáo gian dối về hàng hóa dịch vụ gây hậu quả nghiêm trọng đã bị xử phạt hành chính về hành vi này","Người nào quảng cáo gian dối về hàng hóa, dịch vụ gây hậu quả nghiêm trọng đã bị xử phạt hành chính về hành vi này hoặc đã bị kết án về tội này, chưa được xóa án tích mà còn vi phạm"],a:3},
{id:189,q:"Nhận định nào sau đây SAI khi đề cập đến chức năng của pháp luật?",o:["Pháp luật bảo vệ tất cả các quan hệ xã hội","Pháp luật tác động đến các quan hệ xã hội chủ yếu, tạo hành lang pháp lý an toàn","Chức năng giáo dục của pháp luật thể hiện tính răn đe đối với hành vi vi phạm","Không đáp án nào sai"],a:0},

{id:198,q:"Một công ty xả chất thải ra sông làm cá chết hàng loạt, gây ô nhiễm nặng môi trường. Trách nhiệm pháp lý áp dụng đối với công ty này là:",o:["Trách nhiệm hành chính","Trách nhiệm hình sự","Trách nhiệm hành chính và trách nhiệm dân sự","Trách nhiệm hình sự và trách nhiệm dân sự"],a:2},

{id:304,q:"Theo Luật Đất đai 2013, trường hợp nào Nhà nước giao đất không thu tiền sử dụng đất?",o:["Hộ gia đình, cá nhân được giao đất ở","Hộ gia đình, cá nhân trực tiếp sản xuất nông nghiệp, lâm nghiệp, nuôi trồng thủy sản, làm muối được giao đất nông nghiệp trong hạn mức quy định","Tổ chức kinh tế được giao đất để thực hiện dự án đầu tư xây dựng nhà ở để bán hoặc để bán kết hợp cho thuê","Tổ chức kinh tế được giao đất thực hiện dự án đầu tư hạ tầng nghĩa trang, nghĩa địa để chuyển nhượng quyền sử dụng đất gắn với hạ tầng"],a:1},
{id:305,q:"Người sử dụng đất không có quyền nào?",o:["Được Nhà nước bảo hộ khi người khác xâm phạm quyền, lợi ích hợp pháp về đất đai của mình","Được cấp Giấy chứng nhận quyền sử dụng đất, quyền sở hữu nhà ở và tài sản khác gắn liền với đất","Được nhận chuyển quyền sử dụng đất nông nghiệp vượt hạn mức","Được bồi thường khi Nhà nước thu hồi đất theo quy định của Luật Đất đai"],a:2},
{id:306,q:"Hạn mức giao đất trồng cây hàng năm, đất nuôi trồng thủy sản, đất làm muối cho mỗi hộ gia đình, cá nhân trực tiếp sản xuất nông nghiệp là bao nhiêu?",o:["Không quá 03 héc ta cho tỉnh thuộc khu vực Đông Nam Bộ và ĐBSCL; Không quá 02 héc ta cho tỉnh khác","Không quá 02 héc ta cho tỉnh thuộc khu vực Đông Nam Bộ và ĐBSCL; Không quá 03 héc ta cho tỉnh khác","Không quá 03 héc ta cho mỗi loại đất","Không quá 02 héc ta cho mỗi loại đất"],a:0},
{id:307,q:"Theo Luật Đất đai 2013, trường hợp nào Nhà nước cấp Giấy chứng nhận quyền sử dụng đất?",o:["Người đang quản lý, sử dụng đất nông nghiệp thuộc quỹ đất công ích của xã, phường, thị trấn","Người mua nhà ở, tài sản khác gắn liền với đất","Người nhận khoán đất trong các nông trường, lâm trường","Người thuê, thuê lại đất của người sử dụng đất, trừ trường hợp thuê, thuê lại đất của nhà đầu tư xây dựng, kinh doanh kết cấu hạ tầng trong khu công nghiệp"],a:1},
{id:308,q:"Theo Luật Đất đai 2013, trường hợp nào Nhà nước giao đất có thu tiền sử dụng đất, cho thuê đất theo hình thức đấu giá quyền sử dụng đất?",o:["Sử dụng đất để thực hiện dự án đầu tư xây dựng nhà ở tái định cư","Sử dụng đất được miễn tiền sử dụng đất, tiền thuê đất theo quy định","Cho thuê đất thuộc quỹ đất nông nghiệp sử dụng vào mục đích công ích","Sử dụng đất vào mục đích hoạt động khoáng sản"],a:2},
{id:309,q:"Kể từ ngày nhận được đơn yêu cầu giải quyết tranh chấp đất đai, trong thời hạn bao lâu UBND cấp xã phải tiến hành hòa giải tranh chấp đất đai?",o:["Không quá 15 ngày","Không quá 20 ngày","Không quá 30 ngày","Không quá 45 ngày"],a:3},
{id:310,q:"Tranh chấp đất đai mà đương sự có Giấy chứng nhận quyền sử dụng đất và đã được hòa giải tại UBND cấp xã mà không thành thuộc thẩm quyền giải quyết của cơ quan nào?",o:["Ủy ban nhân dân","Tòa án nhân dân","Cơ quan Thanh tra","Phòng Tài nguyên và môi trường"],a:1},
{id:311,q:"Ông A đang sử dụng một thửa đất (từ năm 2006) nhưng không có giấy tờ gì về đất, được UBND cấp xã xác nhận sử dụng đất ổn định, không có tranh chấp. Ông A muốn được cấp GCNQSD đất thì thuộc trường hợp nào?",o:["Không được cấp Giấy chứng nhận","Được cấp Giấy chứng nhận và phải nộp tiền sử dụng đất","Được cấp Giấy chứng nhận và không phải nộp tiền sử dụng đất","Không được cấp mà phải chuyển sang hình thức thuê đất"],a:2},
{id:312,q:"Thế nào là tham nhũng?",o:["Tham nhũng là hành vi của cán bộ, công chức nhà nước đã lợi dụng chức vụ, quyền hạn đó vì vụ lợi","Tham nhũng là hành vi lợi dụng chức vụ, quyền hạn để vụ lợi","Tham nhũng là hành vi của người có chức vụ, quyền hạn đã lợi dụng chức vụ, quyền hạn đó vì vụ lợi","Tham nhũng là hành vi cửa quyền, hách dịch, đòi hỏi, gây khó khăn, phiền hà của người có chức vụ, quyền hạn"],a:2},
{id:313,q:"Công dân có quyền gì trong công tác phòng, chống tham nhũng?",o:["Công dân chỉ có quyền phát hiện và báo tin về hành vi tham nhũng","Công dân chỉ có quyền giám sát việc thực hiện pháp luật về phòng, chống tham nhũng","Công dân chỉ có quyền phát hiện, kiến nghị với cơ quan nhà nước hoàn thiện pháp luật về phòng, chống tham nhũng và giám sát","Công dân có quyền phát hiện, phản ánh, tố cáo, tố giác, báo tin về hành vi tham nhũng và được bảo vệ, khen thưởng; có quyền kiến nghị với cơ quan nhà nước hoàn thiện pháp luật về phòng, chống tham nhũng và giám sát"],a:3},
{id:314,q:"Thời hạn định kỳ chuyển đổi vị trí công tác là bao nhiêu năm?",o:["Từ đủ 02 năm đến 05 năm theo đặc thù của từng ngành, lĩnh vực","Từ đủ 03 năm đến 06 năm theo đặc thù của từng ngành, lĩnh vực","Từ đủ 02 năm đến 04 năm theo đặc thù của từng ngành, lĩnh vực","Từ đủ 04 năm đến 05 năm theo đặc thù của từng ngành, lĩnh vực"],a:0},
{id:315,q:"Những người nào có nghĩa vụ kê khai tài sản?",o:["Cán bộ, công chức nhà nước","Sĩ quan Công an nhân dân; sĩ quan Quân đội nhân dân, quân nhân chuyên nghiệp","Người giữ chức vụ từ Phó trưởng phòng và tương đương trở lên công tác tại đơn vị sự nghiệp công lập; Người ứng cử đại biểu Quốc hội","Tất cả đều đúng"],a:3},
{id:316,q:"Theo Luật Phòng, chống tham nhũng, người đứng đầu, cấp phó của người đứng đầu cơ quan không được bố trí những người nào giữ chức vụ quản lý về tổ chức nhân sự, kế toán, làm thủ quỹ, thủ kho trong cơ quan?",o:["Vợ hoặc chồng","Vợ hoặc chồng, bố, mẹ, con, anh, chị, em ruột","Bố, mẹ, con, anh, chị, em ruột","Con, anh, chị, em ruột"],a:1},
{id:317,q:"Có bao nhiêu hình thức công khai về tổ chức và hoạt động của cơ quan, tổ chức, đơn vị?",o:["5 hình thức","6 hình thức","7 hình thức","8 hình thức"],a:3},
{id:318,q:"Chọn đáp án đúng về quyền phản ánh, tố cáo hành vi tham nhũng:",o:["Cá nhân, tổ chức có quyền phản ánh, tố cáo về hành vi tham nhũng","Cá nhân, tổ chức có quyền phản ánh về hành vi tham nhũng, cá nhân có quyền tố cáo về hành vi tham nhũng","Tổ chức có quyền phản ánh về hành vi tham nhũng, cá nhân có quyền tố cáo về hành vi tham nhũng","Tất cả đáp án đều sai"],a:1},
{id:319,q:"Thế nào là vụ lợi?",o:["Vụ lợi là hành vi của người có chức vụ, quyền hạn đã lợi dụng chức vụ, quyền hạn đó để tham nhũng","Vụ lợi là việc công chức lợi dụng chức vụ, quyền hạn nhằm đạt được lợi ích vật chất hoặc lợi ích phi vật chất không chính đáng","Vụ lợi là việc người có chức vụ, quyền hạn đã lợi dụng chức vụ, quyền hạn nhằm đạt được lợi ích vật chất hoặc lợi ích phi vật chất không chính đáng","Vụ lợi là hành vi lợi dụng chức vụ, quyền hạn đó để tham nhũng"],a:2},
{id:320,q:"Luật Phòng chống tham nhũng quy định việc tặng quà của cơ quan, tổ chức, đơn vị, người có chức vụ, quyền hạn như thế nào?",o:["Không được sử dụng tài chính công, tài sản công làm quà tặng, trừ trường hợp tặng quà vì mục đích từ thiện, đối ngoại và trong trường hợp cần thiết khác theo quy định của pháp luật","Tuyệt đối không được sử dụng tài chính công, tài sản công làm quà tặng","Được sử dụng tài chính công, tài sản công làm quà tặng","Chỉ được sử dụng tài chính công, tài sản công làm quà tặng vì mục đích từ thiện"],a:0},
{id:321,q:"Luật Phòng chống tham nhũng quy định việc nhận quà tặng của cơ quan, tổ chức, đơn vị, người có chức vụ, quyền hạn như thế nào?",o:["Được trực tiếp hoặc gián tiếp nhận quà tặng dưới mọi hình thức của cơ quan, tổ chức, đơn vị, cá nhân có liên quan đến công việc do mình giải quyết","Được trực tiếp nhận quà tặng dưới mọi hình thức","Được gián tiếp nhận quà tặng dưới mọi hình thức","Không được trực tiếp hoặc gián tiếp nhận quà tặng dưới mọi hình thức của cơ quan, tổ chức, đơn vị, cá nhân có liên quan đến công việc do mình giải quyết"],a:3},
{id:322,q:"Luật Phòng chống tham nhũng năm 2018 quy định việc xử lý tài sản tham nhũng như thế nào?",o:["Tài sản tham nhũng phải được thu hồi theo quy định của pháp luật","Tài sản tham nhũng phải được trả lại cho chủ sở hữu, người quản lý hợp pháp","Tài sản tham nhũng phải được tịch thu theo quy định của pháp luật","Tài sản tham nhũng phải được thu hồi, trả lại cho chủ sở hữu, người quản lý hợp pháp hoặc tịch thu theo quy định của pháp luật"],a:3},
{id:323,q:"Người kê khai tài sản, thu nhập phải có nghĩa vụ gì?",o:["Kê khai tài sản, thu nhập và biến động về tài sản, thu nhập của mình","Kê khai tài sản, thu nhập và biến động về tài sản, thu nhập của mình, của vợ hoặc chồng","Kê khai tài sản, thu nhập và biến động về tài sản, thu nhập của mình, của vợ hoặc chồng, con chưa thành niên theo quy định của Luật này","Kê khai tài sản, thu nhập và biến động về tài sản, thu nhập của mình, con chưa thành niên"],a:2},
{id:324,q:"Trong phòng chống tham nhũng công tác kiểm tra của cơ quan, tổ chức, đơn vị bao gồm những hình thức nào?",o:["Kiểm tra thường xuyên được tiến hành theo chương trình, kế hoạch","Chỉ kiểm tra đột xuất được tiến hành khi phát hiện có dấu hiệu tham nhũng","Kiểm tra thường xuyên và kiểm tra đột xuất khi phát hiện có dấu hiệu tham nhũng","Kiểm tra thường xuyên và kiểm tra đột xuất"],a:2},
{id:325,q:"Khi phát hiện có hành vi tham nhũng, người đứng đầu cơ quan quản lý nhà nước phải làm gì?",o:["kịp thời xử lý theo thẩm quyền hoặc báo cho cơ quan có thẩm quyền xử lý theo quy định của pháp luật","kịp thời xử lý theo thẩm quyền","báo cho cơ quan có thẩm quyền xử lý theo quy định của pháp luật","Họp cơ quan và xử lý nội bộ"],a:0},
{id:326,q:"Chọn đáp án đúng về xử lý người có hành vi tham nhũng:",o:["Người có hành vi tham nhũng giữ bất kì chức vụ, vị trí công tác nào đều phải bị xử lý nghiêm minh theo quy định của pháp luật, kể cả người đã nghỉ hưu, thôi việc, chuyển công tác","Người có hành vi tham nhũng đều phải bị xử lý nghiêm minh, kể cả người đã thôi việc, chuyển công tác","Người có hành vi tham nhũng đều phải bị xử lý nghiêm minh theo quy định của pháp luật","Người có hành vi tham nhũng đều phải bị xử lý nghiêm minh, kể cả người đã nghỉ hưu, chuyển công tác"],a:0},
{id:327,q:"Vi phạm hình sự ở mức độ tội phạm ít nghiêm trọng, khung hình cao nhất là…",o:["7 năm","5 năm","3 năm","8 năm"],a:2},
{id:328,q:"Vi phạm hình sự ở mức độ tội phạm rất nghiêm trọng, khung hình cao nhất là…",o:["7 năm","15 năm","3 năm","18 năm"],a:1},
{id:329,q:"Vi phạm hình sự ở mức độ tội phạm đặc biệt nghiêm trọng, khung hình cao nhất là…",o:["20 năm","18 năm","15 năm","Tử hình"],a:3,e:"⚖️ Theo Điều 9 BLHS 2015, tội phạm đặc biệt nghiêm trọng có mức cao nhất của khung là <b>trên 15 năm tù, tù chung thân hoặc tử hình</b>. Do đó khung hình phạt cao nhất là <b>Tử hình</b> — không phải 20 năm. Lưu ý: 20 năm là giới hạn tối đa của hình phạt tù có thời hạn, nhưng loại tội này còn có tù chung thân và tử hình."},
{id:330,q:"Những người có hành vi trái pháp luật sẽ bị cơ quan nhà nước có thẩm quyền xử lý theo quy định của pháp luật là thể hiện…?",o:["mục đích và pháp luật","đặc trưng của pháp luật","bản chất của pháp luật","vai trò của pháp luật"],a:1},
{id:331,q:"Bạn A thắc mắc tại sao cả Hiến pháp và luật giáo dục đều quy định công dân có quyền và nghĩa vụ học tập. Em sẽ sử dụng đặc trưng nào dưới đây của pháp luật để giải thích cho bạn A?",o:["tính quyền lực của pháp luật","tính xác định chặt chẽ về hình thức","tính quy phạm phổ biến của pháp luật","Tính bắt buộc chung của pháp luật"],a:1},
{id:332,q:"Để xử lý người có hành vi xâm hại đến các lợi ích của giai cấp cầm quyền, Nhà nước sẽ sử dụng quyền lực có tính cưỡng chế. Khẳng định này là nội dung nào dưới đây của pháp luật?",o:["đặc trưng của pháp luật","bản chất của pháp luật","vai trò của pháp luật","chức năng của pháp luật"],a:1},
{id:333,q:"Pháp luật do nhà nước ban hành phù hợp với ý chí của giai cấp cầm quyền là thể hiện bản chất nào dưới đây của pháp luật?",o:["chính trị","kinh tế","xã hội","giai cấp"],a:3},
{id:334,q:"Khi đạo đức trở thành nội dung của quy phạm pháp luật thì các giá trị đạo đức được nhà nước bảo đảm thực hiện bằng…",o:["sức ép của dư luận xã hội","lương tâm của mỗi cá nhân","niềm tin của mọi người","sức mạnh quyền lực của nhà nước"],a:3},
{id:335,q:"Dựa vào nội dung nào dưới đây của pháp luật mà nhà nước có thể kiểm tra, kiểm soát được các hoạt động của mọi công dân?",o:["đặc trưng của pháp luật","bản chất của pháp luật","chức năng của pháp luật","vai trò của pháp luật"],a:3},
{id:336,q:"Công dân có thể thực hiện quyền kinh doanh phù hợp với khả năng điều kiện của mình là biểu hiện vai trò nào dưới đây của pháp luật?",o:["là phương tiện để nhà nước quản lý xã hội","là phương tiện để nhà nước phát huy quyền lực của mình","là phương tiện để công dân bảo vệ quyền và nghĩa vụ của mình","là phương tiện để công dân bảo vệ quyền và lợi ích hợp pháp của mình"],a:3},

{id:400,q:"Người từ đủ 14 tuổi đến dưới 16 tuổi phải chịu trách nhiệm hình sự về…",o:["mọi tội phạm","tội phạm nghiêm trọng do vô ý","các tội phạm được liệt kê cụ thể tại khoản 2 Điều 12 BLHS 2015","tội phạm do lỗi cố ý"],a:2,e:"⚖️ Theo BLHS 2015 sửa đổi 2017 (Điều 12 khoản 2), người 14–16 tuổi chịu TNHS về <b>các tội danh được liệt kê đích danh</b> trong luật (giết người, cố ý gây thương tích nặng, hiếp dâm, cướp tài sản, bắt cóc chiếm đoạt tài sản…). Đây là thay đổi so với BLHS 1999 cũ vốn quy định chung chung là <i>tội phạm đặc biệt nghiêm trọng</i>. Câu hỏi này được xây dựng theo tư duy luật cũ nên đáp án C đã được cập nhật cho phù hợp BLHS hiện hành."},

{id:416,q:"Yếu tố nào sau đây là một trong những dấu hiệu cơ bản (đặc điểm) của tội phạm? (câu 416)",o:["Trái với đạo đức xã hội","Vi phạm pháp luật","Phải đươc quy định trong Bộ luật Hình sự","Phải được quy định trong các văn bản quy phạm pháp luật"],a:2},
{id:417,q:"Đâu là loại tội phạm nghiêm trọng?",o:["là tội phạm có tính chất và mức độ nguy hiểm không lớn mà khung hình phạt cao nhất là phạt tiền, cải tạo không giam giữ hoặc phạt tù đến 03 năm","là tội phạm có tính chất và mức độ nguy hiểm lớn mà khung hình phạt cao nhất là từ trên 03 năm tù đến 07 năm tù","là tội phạm có tính chất và mức độ nguy hiểm rất lớn mà khung hình phạt cao nhất là từ trên 07 năm tù đến 15 năm tù","là tội phạm có tính chất và mức độ nguy hiểm đặc biệt lớn mà khung hình phạt cao nhất là từ trên 15 năm tù đến 20 năm tù, tù chung thân hoặc tử hình"],a:1},
{id:418,q:"Đâu là loại tội phạm rất nghiêm trọng?",o:["là tội phạm có tính chất và mức độ nguy hiểm không lớn mà khung hình phạt cao nhất là phạt tiền, cải tạo không giam giữ hoặc phạt tù đến 03 năm","là tội phạm có tính chất và mức độ nguy hiểm lớn mà khung hình phạt cao nhất là từ trên 03 năm tù đến 07 năm tù","là tội phạm có tính chất và mức độ nguy hiểm rất lớn mà khung hình phạt cao nhất là từ trên 07 năm tù đến 15 năm tù","là tội phạm có tính chất và mức độ nguy hiểm đặc biệt lớn mà khung hình phạt cao nhất là từ trên 15 năm tù đến 20 năm tù, tù chung thân hoặc tử hình"],a:2},
{id:419,q:"Cố ý phạm tội là phạm tội trong những trường hợp sau đây?",o:["Người phạm tội tuy thấy trước hành vi của mình có thể gây ra hậu quả nguy hại cho xã hội nhưng cho rằng hậu quả đó sẽ không xảy ra hoặc có thể ngăn ngừa được","Người phạm tội không thấy trước hành vi của mình có thể gây ra hậu quả nguy hại cho xã hội, mặc dù phải thấy trước và có thể thấy trước hậu quả đó","Người phạm tội nhận thức rõ hành vi của mình là nguy hiểm cho xã hội, không thấy trước hậu quả của hành vi đó có thể xảy ra, tuy không mong muốn nhưng vẫn có ý thức để mặc cho hậu quả xảy ra","Người phạm tội nhận thức rõ hành vi của mình là nguy hiểm cho xã hội, thấy trước hậu quả của hành vi đó và mong muốn hậu quả xảy ra"],a:3},
{id:420,q:"Vô ý phạm tội là phạm tội trong những trường hợp sau đây?",o:["Người phạm tội không thấy trước hành vi của mình có thể gây ra hậu quả nguy hại cho xã hội vì vậy cho rằng hậu quả đó sẽ không xảy ra hoặc có thể ngăn ngừa được","Người phạm tội không thấy trước hành vi của mình có thể gây ra hậu quả nguy hại cho xã hội, mặc dù phải thấy trước và có thể thấy trước hậu quả đó","Người phạm tội nhận thức rõ hành vi của mình là nguy hiểm cho xã hội, thấy trước hậu quả của hành vi đó có thể xảy ra, tuy không mong muốn nhưng vẫn có ý thức để mặc cho hậu quả xảy ra","Người phạm tội nhận thức rõ hành vi của mình là nguy hiểm cho xã hội, thấy trước hậu quả của hành vi đó và mong muốn hậu quả xảy ra"],a:1},
{id:421,q:"Cơ sở của trách nhiệm hình sự là:",o:["Hành vi được Viện kiểm sát cho phạm tội thì phải chịu trách nhiệm hình sự","Có hành vi gây nguy hiểm thì phải chịu trách nhiệm hình sự","Phạm tội gây thiệt hại vật chất cho người khác phải chịu trách nhiệm hình sự","Người nào phạm một tội đã được Bộ luật Hình sự quy định mới phải chịu trách nhiệm hình sự"],a:3},
{id:422,q:"Đâu là dấu hiệu của tội phạm?",o:["hành vi nguy hiểm cho xã hội được quy định trong Bộ luật Hình sự","hành vi tuy có dấu hiệu của tội phạm nhưng tính chất nguy hiểm cho xã hội không đáng kể","hành vi nguy hiểm do người có năng lực hành vi dân sự thực hiện một cách cố ý hoặc vô ý","Có hành vi nguy hiểm"],a:0},
{id:423,q:"Căn cứ vào tính chất và mức độ nguy hiểm cho xã hội của hành vi phạm tội được quy định trong Bộ luật Hình sự, tội phạm được phân thành mấy loại?",o:["03 loại","04 loại","05 loại","06 loại"],a:1},
{id:424,q:"Nghĩa vụ người lao động, người sử dụng lao động trong việc giải quyết tranh chấp lao động:",o:["Cung cấp đầy đủ tài liệu cho cơ quan có thẩm quyền và thi hành mọi quyết định giải quyết tranh chấp của các cơ quan, tổ chức có thẩm quyền","Cung cấp đầy đủ tài liệu, thi hành mọi quyết định của cơ quan, tổ chức có thẩm quyền giải quyết tranh chấp","Cung cấp đầy đủ tài liệu chứng cứ cho cơ quan giải quyết tranh chấp. Thi hành mọi thoả thuận đã đạt, biên bản hoà giải có kết quả, quyết định, bản án đã có hiệu lực","Cung cấp đầy đủ mọi chứng cứ, tài liệu cho các cơ quan có thẩm quyền, thi hành tốt mọi quyết định giải quyết tranh chấp của cơ quan có thẩm quyền"],a:2},
{id:425,q:"Quyền của người lao động, người sử dụng lao động trong việc giải quyết tranh chấp lao động:",o:["Tham gia trực tiếp hoặc rút đơn không tham gia giải quyết tranh chấp. Có thể cử người đại diện thay mình tham gia quá trình giải quyết tranh chấp","Trực tiếp hoặc cử đại diện tham gia giải quyết tranh chấp – Rút đơn, thay đổi nội dung tranh chấp, thay người đại diện","Trực tiếp tham gia giải quyết tranh chấp hoặc cử đại diện tham gia. Rút đơn không tham gia giải quyết tranh chấp nữa","Trực tiếp tham gia hoặc cử đại diện tham gia hoặc thay đổi người đại diện hoặc rút đơn không tham gia giải quyết tranh chấp nữa"],a:1},
{id:426,q:"Hình thức sa thải người lao động chỉ được áp dụng trong trường hợp nào?",o:["Người lao động tự ý bỏ việc không có lý do chính đáng, đang bị xử một hình thức kỷ luật mà tái phạm, trộm cắp, tham ô tài sản của doanh nghiệp","Trộm cắp, tham ô, tiết lộ bí mật công nghệ – kinh doanh của doanh nghiệp, đang bị kỷ luật chuyển làm việc khác lại tái phạm, tự ý bỏ việc","Người lao động tự ý bỏ việc 05 ngày cộng dồn trong 30 ngày hoặc 20 ngày cộng dồn trong 365 ngày không có lý do chính đáng, trộm cắp tham ô, tiết lộ bí mật của doanh nghiệp, đang bị kỷ luật chuyển làm việc khác lại tái phạm","Người lao động tự ý bỏ việc từ 7 đến 20 ngày không có lý do chính đáng, trộm cắp, tiết lộ bí mật, tái phạm nhiều lần mà không xử"],a:2,e:"⚖️ Theo BLLĐ 2019 (Điều 125), số ngày tự ý bỏ việc để áp dụng sa thải là <b>05 ngày cộng dồn trong thời hạn 30 ngày</b> hoặc <b>20 ngày cộng dồn trong thời hạn 365 ngày</b> kể từ ngày đầu tiên tự ý bỏ việc. Con số <i>7 ngày/tháng</i> là quy định của BLLĐ 1994 (30 năm trước), không còn hiệu lực."},
{id:427,q:"Người sử dụng lao động có nghĩa vụ gì đối với người lao động cao tuổi làm việc tại cơ sở của mình?",o:["Áp dụng chế độ làm việc mềm dẻo trong một năm trước khi nghỉ hưu. Nếu hưu vẫn tiếp tục làm hợp đồng thì ngoài chế độ hợp đồng mới, vẫn hưởng mọi chế độ như khi chưa hưu (trừ lương)","Áp dụng thì giờ làm việc mềm dẻo trong một năm trước khi nghỉ hưu. Có thể tiếp tục sử dụng những người lưu theo chế độ hợp đồng lao động mới","Áp dụng chế độ và thời giờ làm việc mềm dẻo, một ngày không làm trọn 8 tiếng, một tuần không làm quá 35 tiếng","Áp dụng thời giờ làm việc mềm dẻo, một ngày không làm quá 7 tiếng, 1 tuần không làm trọn 5 ngày"],a:0},
{id:428,q:"Người sử dụng lao động có nghĩa vụ gì đối với lao động chưa thành niên làm việc ở cơ sở mình?",o:["Giao việc phù hợp với sức khoẻ, có sổ theo dõi riêng, một ngày làm việc không quá 8 tiếng (theo BLLĐ 2019)","Lao động chưa thành niên là người chưa đến 18 tuổi nên chỉ được giao 1 số việc theo quy định của Bộ Lao động","Giao việc phù hợp với sức khoẻ, chỉ giao 1 số việc theo quy định của Bộ Lao động, có sổ theo dõi riêng","Chỉ được giao công việc theo đúng quy định của Bộ Lao động và có sổ theo dõi riêng"],a:2,e:"⚖️ Theo BLLĐ 2019 (Điều 144–147), người sử dụng lao động phải: giao việc phù hợp sức khỏe; chỉ giao các công việc theo danh mục của Bộ LĐ-TBXH; lập sổ theo dõi riêng. Thời giờ làm việc với người từ 15–dưới 18 tuổi là <b>không quá 08 giờ/ngày và 40 giờ/tuần</b> — con số <i>7 tiếng</i> là quy định của BLLĐ 1994, không còn hiệu lực. Đáp án C đủ 3 nghĩa vụ chính và không sai thông tin giờ làm việc."},
{id:429,q:"Theo Luật Lao động, tiền lương của người lao động được trả như thế nào?",o:["Do hai bên thoả thuận trong hợp đồng, mức lương không được thấp hơn mức lương tối thiểu do Nhà nước quy định","Trả theo năng suất lao động, chất lượng, hiệu quả công việc, do hai bên thoả thuận","Trả theo năng suất, chất lượng, hiệu quả công việc, mức lương không thể thấp hơn mức tối thiểu do Nhà nước quy định","Theo năng suất, chất lượng, hiệu quả công việc do hai bên thoả thuận trong hợp đồng nhưng không được thấp hơn mức tối thiểu do Nhà nước quy định"],a:3},
{id:430,q:"Cách thức giải quyết tranh chấp lao động:",o:["Hai bên tự dàn xếp, thương lượng trực tiếp, thông qua trọng tài hoà giải","Thương lượng trực tiếp, thông qua trọng tài hoà giải, tham gia của công đoàn","Thương lượng trực tiếp, tham gia của công đoàn, thông qua trọng tài hoà giải","Thương lượng trực tiếp, tham gia của công đoàn, công khai, khách quan, kịp thời, thông qua trọng tài hoà giải"],a:3}

const STATE_KEY = 'pldc_v2';

  progress: {}, // id -> {correct, wrong, unsure, marked}

};

// ============================================================
// BỘ LƯU TRỮ GHI CHÚ CÁ NHÂN (LƯU VĨNH VIỄN)
// ============================================================
let customNotes = {};
try {
  const savedNotes = localStorage.getItem('pldc_notes');
  if (savedNotes) customNotes = JSON.parse(savedNotes);
} catch(e){}


function saveNote(qId) {
  const txt = document.getElementById(`custom-note-${qId}`).value.trim();
  if (txt === '') {
    delete customNotes[qId];
    showToast('🗑️ Đã xóa ghi chú cá nhân của câu này');
  } else {
    customNotes[qId] = txt;
    showToast('📌 Đã lưu ghi chú!');
  }
  localStorage.setItem('pldc_notes', JSON.stringify(customNotes));
  
  // Nếu đang ở màn hình xem Ghi chú, tải lại trang để ẩn câu vừa xóa
  if (state.mode === 'notes') renderNotesView();
}

// ============================================================
// NÂNG CẤP LƯU PHIÊN HỌC (CHỐNG MẤT KHI F5)
// ============================================================
function saveState() {
  // Cập nhật vị trí hiện tại vào session riêng của thẻ đang học
  const key = `${state.chapterId}_${state.filter}`;
  state.sessions[key] = {
    queue: state.queue,
    qIdx: state.qIdx
  };

  try { 
    localStorage.setItem(STATE_KEY, JSON.stringify({
      progress: state.progress,
      sessions: state.sessions, // Lưu toàn bộ các sessions
      chapterId: state.chapterId,
      filter: state.filter,
      isShuffled: state.isShuffled
    })); 
  } catch(e){}
}

function loadState() {
  // Kiểm tra URL hash — dùng để nhập tiến trình từ thiết bị khác
  try {
    const hash = window.location.hash;
    if (hash && hash.startsWith('#data=')) {
      const encoded = hash.slice(6);
      const d = JSON.parse(decodeURIComponent(atob(encoded)));
      state.progress = d.progress || {};
      state.sessions = d.sessions || {};
      state.chapterId = d.chapterId !== undefined ? d.chapterId : 0;
      state.filter = d.filter || 'all';
      state.isShuffled = !!d.isShuffled;
      if (d.notes) customNotes = d.notes;
      localStorage.setItem(STATE_KEY, JSON.stringify({
        progress: state.progress, sessions: state.sessions,
        chapterId: state.chapterId, filter: state.filter, isShuffled: state.isShuffled
      }));
      if (d.notes) localStorage.setItem('pldc_notes', JSON.stringify(customNotes));
      history.replaceState(null, '', window.location.pathname + window.location.search);
      setTimeout(() => showToast('✅ Nhập tiến trình từ link thành công!', 3500), 400);
      return;
    }
  } catch(e) {}

  try {
    const s = localStorage.getItem(STATE_KEY);
    if (s) {
      const d = JSON.parse(s);
      state.progress = d.progress || {};
      state.sessions = d.sessions || {};
      state.chapterId = d.chapterId !== undefined ? d.chapterId : 0;
      state.filter = d.filter || 'all';
      state.isShuffled = !!d.isShuffled;

      // Khôi phục lại trạng thái của thẻ cuối cùng người dùng xem
      const key = `${state.chapterId}_${state.filter}`;
      if (state.sessions[key]) {
        state.queue = state.sessions[key].queue || [];
        state.qIdx = state.sessions[key].qIdx || 0;
      }
    }
  } catch(e){}
}

function exportStateAsURL() {
  const data = {
    progress: state.progress,
    sessions: state.sessions,
    chapterId: state.chapterId,
    filter: state.filter,
    isShuffled: state.isShuffled,
    notes: customNotes
  };
  try {
    const encoded = btoa(encodeURIComponent(JSON.stringify(data)));
    const url = window.location.origin + window.location.pathname + '#data=' + encoded;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(() => {
        showToast('✅ Đã copy link! Mở link đó trên điện thoại là xong.', 4000);
      }).catch(() => {
        prompt('Copy link này, mở trên điện thoại là xong:', url);
      });
    } else {
      prompt('Copy link này, mở trên điện thoại là xong:', url);
    }
  } catch(e) {
    showToast('❌ Lỗi tạo link, thử lại!');
  }
}

function chapterQuestions(chapterId, filter) {
  const ch = CHAPTERS.find(c => c.id === chapterId);
  let ids = ch ? ch.ids : QUESTIONS.map(q=>q.id);
  ids = ids.filter(id => QUESTIONS.find(q=>q.id===id));
  if (filter === 'wrong') ids = ids.filter(id => (state.progress[id]||{}).wrong > 0);
  if (filter === 'unsure') ids = ids.filter(id => (state.progress[id]||{}).unsure);
  if (filter === 'marked') ids = ids.filter(id => (state.progress[id]||{}).marked);
  return ids;
}

function toggleShuffle() {
  state.isShuffled = !state.isShuffled;
  state.queue = buildQueue(state.chapterId, state.filter);
  state.qIdx = 0; 
  saveState(); // Cập nhật cấu hình
  showToast(state.isShuffled ? '🔀 Đã BẬT đảo ngẫu nhiên' : '⬇️ Đã TẮT đảo (hiện theo thứ tự)');
  loadQuestion();
}

function resetCurrentChapter() {
  if (!confirm('⚠️ Bạn có chắc muốn làm lại từ đầu phần này? (Xóa lịch sử đúng/sai và quay về câu 1)')) return;

  // 1. Xóa lịch sử đúng/sai của các câu trong phần này
  state.queue.forEach(id => {
    delete state.progress[id];
  });

  // 2. Bắt buộc reset vị trí về 0 và lấy lại danh sách câu hỏi ban đầu
  state.qIdx = 0;
  state.queue = buildQueue(state.chapterId, state.filter);

  // 3. Cập nhật lại session ngay lập tức với qIdx = 0
  const key = `${state.chapterId}_${state.filter}`;
  state.sessions[key] = {
    queue: state.queue,
    qIdx: 0
  };

  // 4. Lưu lại trạng thái mới và tải lại câu hỏi
  saveState();
  showToast('Đã reset! Bắt đầu lại từ câu 1.');
  loadQuestion();
}

function buildQueue(chapterId, filter) {
  let ids = chapterQuestions(chapterId, filter);

  if (!state.isShuffled) {
    // Nếu tắt đảo: Sắp xếp theo đúng thứ tự ID từ nhỏ đến lớn
    ids.sort((a, b) => a - b);
  } else {
    // Nếu bật đảo: Xáo trộn ngẫu nhiên hoàn toàn
    ids = shuffleArray(ids);
  }
  return ids;
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function getShuffledOpts(q) {
  const opts = q.o.map((text,origIdx)=>({text,origIdx}));
  return shuffleArray(opts);
}

function initProgress(id) {
  if (!state.progress[id]) state.progress[id] = {correct:0, wrong:0, unsure:false, marked:false};
}

// ============================================================
// STATS
// ============================================================
function totalStats() {
  let known=0, unknown=0, unseen=0;
  QUESTIONS.forEach(q => {
    const p = state.progress[q.id];
    if (!p || (p.correct===0 && p.wrong===0)) unseen++;
    else if (p.correct>0 && p.wrong===0) known++;
    else unknown++;
  });
  return {known, unknown, unseen, total:QUESTIONS.length};
}

function showToast(msg, dur=2000) {

  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), dur);
}

// ============================================================
// STUDY VIEW
// ============================================================
function startStudy(chapterId, filter='all') {
  state.chapterId = chapterId;
  state.filter = filter;
  const key = `${chapterId}_${filter}`;

  // Kiểm tra xem thẻ này đã được học dở trước đó chưa
  if (state.sessions[key] && state.sessions[key].queue && state.sessions[key].queue.length > 0) {
    // Nếu có, lôi từ trong session ra để làm tiếp
    state.queue = state.sessions[key].queue;
    state.qIdx = state.sessions[key].qIdx;
  } else {
    // Nếu chưa, tạo danh sách câu hỏi mới từ đầu
    state.queue = buildQueue(chapterId, filter);
    state.qIdx = 0;
    // Khởi tạo luôn session cho thẻ này
    state.sessions[key] = { queue: state.queue, qIdx: 0 };
  }
  
  if (state.queue.length === 0) {
    showToast('Không có câu nào! Thay đổi bộ lọc nhé.');
    return;
  }
  
  state.answered = false;
  saveState(); // Lưu trạng thái
  state.mode = 'study';
  loadQuestion();
}

function loadQuestion() {
  if (state.qIdx >= state.queue.length) {
    const key = `${state.chapterId}_${state.filter}`;
    state.sessions[key] = { queue: [], qIdx: 0 };
    saveState();
    showToast('🎉 Đã hoàn thành danh sách câu hỏi!');
    renderHome();
    return;
  }
  const qId = state.queue[state.qIdx];
  const q = getQ(qId);
  state.shuffledOpts = getShuffledOpts(q);
  state.answered = false;
  renderStudy();
}

function renderStudy() {
  const qId = state.queue[state.qIdx];
  const q = getQ(qId);
  const p = state.progress[qId] || {};
  
  // TÍNH TỔNG SỐ CÂU ĐÚNG / ĐANG SAI CỦA BỘ HIỆN TẠI
  const uniqueIds = [...new Set(state.queue)];
  let countCorrect = 0, countWrong = 0;
  uniqueIds.forEach(id => {
    const pr = state.progress[id];
    if (pr && pr.wrong > 0) countWrong++;
    else if (pr && pr.correct > 0) countCorrect++;
  });

  const pct = Math.round(state.qIdx / state.queue.length * 100);

  let filterLabel = '';
  if (state.filter==='wrong') filterLabel = ' · 🔴 Câu sai';
  else if (state.filter==='marked') filterLabel = ' · 🔖 Đã đánh dấu';

  const chName = CHAPTERS.find(c=>c.id===state.chapterId)?.short || '';

  const markedActive = p.marked ? 'active-marked' : '';

  let html = `
  <div class="quiz-header">
    <div>
      <div style="font-size:13px;color:var(--accent);font-weight:700;margin-bottom:2px">${chName}${filterLabel}</div>
      <div class="quiz-info">Câu <b>${state.qIdx+1}</b>/${state.queue.length} &nbsp;·&nbsp; Tổng đúng: <b>${countCorrect}</b> &nbsp;·&nbsp; Đang sai: <b style="color:var(--red)">${countWrong}</b></div>
    </div>
    <button class="btn btn-secondary btn-sm" onclick="renderHome()">← Về trang chủ</button>
  </div>
  <div class="progress-bar"><div class="progress-bar-fill" style="width:${pct}%"></div></div>

  <div class="flag-row">
    <button id="btn-flag-marked" class="flag-btn ${markedActive}" onclick="toggleFlag('marked',${qId})">🔖 Đánh dấu</button>
    
    <button class="flag-btn" onclick="toggleShuffle()" style="margin-left:auto; border-color:var(--accent); color:var(--accent)">
      🔀 Đảo câu: ${state.isShuffled ? 'BẬT' : 'TẮT'}
    </button>
    <button class="flag-btn" onclick="resetCurrentChapter()" style="border-color:var(--red); color:var(--red)">
      🔄 Reset phần này
    </button>
  </div>

  <div class="question-card">
    <div class="q-num">CÂU ${q.id} / 430</div>
    <div class="q-text">${q.q}</div>
    <div class="options" id="optList">`;

  const letters = ['A','B','C','D'];
  state.shuffledOpts.forEach((opt, i) => {
    html += `<div class="option" id="opt-${i}" onclick="selectAnswer(${i},${opt.origIdx},${qId})">
      <span class="opt-letter">${letters[i]}</span>
      <span>${opt.text}</span>
    </div>`;
  });

  html += `</div>
    <div class="feedback-box" id="feedbackBox"></div>
  </div>

  <div class="quiz-actions" id="quizActions">
    <button class="btn btn-secondary" onclick="skipQ()">⏭ Bỏ qua</button>
  </div>`;

  app.innerHTML = html;
  updateHeader();
}

function jumpToQuestionInFilter(qId, chapterId, filter) {
  state.chapterId = chapterId;
  state.filter = filter;
  const key = `${chapterId}_${filter}`;
  
  state.queue = buildQueue(chapterId, filter);
  
  const idx = state.queue.indexOf(qId);
  if (idx !== -1) {
    state.qIdx = idx;
    state.sessions[key] = { queue: state.queue, qIdx: state.qIdx };
    saveState();
    
    state.answered = false;
    state.mode = 'study';
    
    const q = getQ(qId);
    state.shuffledOpts = getShuffledOpts(q);
    renderStudy();
  }
}

function selectAnswer(shuffledIdx, origIdx, qId) {
  if (state.answered) return;
  state.answered = true;
  initProgress(qId);

  const q = getQ(qId);
  const correct = origIdx === q.a;
  const letters = ['A','B','C','D'];

  // Tô màu đáp án
  state.shuffledOpts.forEach((opt, i) => {
    const el = document.getElementById(`opt-${i}`);
    el.classList.add('disabled');
    if (opt.origIdx === q.a) el.classList.add('correct');
    else if (i === shuffledIdx && !correct) el.classList.add('wrong');
  });

  // LOGIC CẬP NHẬT ĐÚNG/SAI CHUẨN XÁC
  if (correct) {
    state.progress[qId].correct = 1; // Làm đúng thì đánh dấu là đúng
    state.progress[qId].wrong = 0;   // Xóa án sai (nếu trước đó đã làm sai)
  } else {
    state.progress[qId].correct = 0;
    state.progress[qId].wrong = 1;   // Nếu sai thì ghim lại là 1 (không cộng dồn lên 2, 3...)
  }
  saveState();

  // TÍNH LẠI THÔNG SỐ ĐỂ CẬP NHẬT NGAY LÊN GIAO DIỆN
  const uniqueIds = [...new Set(state.queue)];
  let countCorrect = 0, countWrong = 0;
  uniqueIds.forEach(id => {
    const pr = state.progress[id];
    if (pr && pr.wrong > 0) countWrong++;
    else if (pr && pr.correct > 0) countCorrect++;
  });

  const infoEl = document.querySelector('.quiz-info');
  if (infoEl) {
    infoEl.innerHTML = `Câu <b>${state.qIdx+1}</b>/${state.queue.length} &nbsp;·&nbsp; Tổng đúng: <b>${countCorrect}</b> &nbsp;·&nbsp; Đang sai: <b style="color:var(--red)">${countWrong}</b>`;
  }

  // Khối phản hồi & Lời giải thích của hệ thống
  const fb = document.getElementById('feedbackBox');
  const correctOptText = q.o[q.a];
  const explainHtml = q.e ? `<div style="margin-top:12px; padding-top:12px; border-top:1px dashed currentColor; font-size:13px; line-height:1.55">💡 <b>Giải thích:</b> ${q.e}</div>` : '';

  // KHỐI GHI CHÚ CÁ NHÂN (Tự động tải ghi chú cũ lên nếu có)
  const currentNote = customNotes[qId] || '';
  const noteHtml = `
    <div style="margin-top:16px; padding-top:14px; border-top:1px dashed rgba(255,255,255,0.15); text-align:left; color:var(--text);">
      <div style="font-size:13px; font-weight:700; margin-bottom:6px; color:var(--muted)">📌 Ghi chú cá nhân (Kiến thức muốn nhớ thêm):</div>
      <textarea id="custom-note-${qId}" 
        style="width:100%; min-height:75px; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); padding:10px; font-family:inherit; font-size:13px; line-height:1.5; resize:vertical; margin-bottom:8px; outline:none;" 
        placeholder="Nhập những điều bên lề bạn tự đúc kết cho câu này tại đây...">${currentNote}</textarea>
      <div style="text-align: right;">
        <button class="btn btn-secondary btn-sm" onclick="saveNote(${qId})" style="font-size:12px; padding:6px 12px; background:var(--surface2); border-color:var(--border);">💾 Lưu ghi chú</button>
      </div>
    </div>
  `;

  if (correct) {
    fb.className = 'feedback-box correct';
    fb.innerHTML = `✅ Chính xác! Đáp án: <b>${letters[state.shuffledOpts.findIndex(o=>o.origIdx===q.a)]}. ${correctOptText}</b>${explainHtml}${noteHtml}`;
  } else {
    fb.className = 'feedback-box wrong';
    fb.innerHTML = `❌ Sai rồi! Đáp án đúng: <b>${letters[state.shuffledOpts.findIndex(o=>o.origIdx===q.a)]}. ${correctOptText}</b>${explainHtml}${noteHtml}`;
  }
  fb.style.display = 'block';

  // Cập nhật nút chuyển câu
  document.getElementById('quizActions').innerHTML = `
    <button class="btn btn-primary" onclick="nextQ()">Câu tiếp theo →</button>
    <button class="btn btn-secondary" onclick="skipQ()">⏭ Bỏ qua</button>
  `;
}

function nextQ() {
  const lastQId = state.queue[state.qIdx];
  const p = state.progress[lastQId];
  state.qIdx++;

  // Nếu câu vừa rồi trả lời sai, tự động nhét nó vào lại hàng đợi (cách 3 câu)
  if (p && p.wrong > 0) {
    const insertPos = Math.min(state.qIdx + 3, state.queue.length);
    state.queue.splice(insertPos, 0, lastQId);
  }
  saveState(); // Cập nhật vị trí
  loadQuestion();
}

function skipQ() {
  state.qIdx++;
  saveState(); // Cập nhật vị trí
  loadQuestion();
}

function toggleFlag(type, qId) {
  initProgress(qId);
  state.progress[qId][type] = !state.progress[qId][type];
  saveState();
  
  const btn = document.getElementById(`btn-flag-${type}`);
  if (btn) {
    if (state.progress[qId][type]) {
      btn.classList.add(`active-${type}`);
    } else {
      btn.classList.remove(`active-${type}`);
    }
  }
}

// ============================================================
// EXAM SETUP
// ============================================================
function renderExamSetup() {
  state.mode = 'home';
  updateHeader();
  let chapterOpts = CHAPTERS.map(ch=>`<option value="${ch.id}">${ch.name} (${ch.ids.filter(id=>QUESTIONS.find(q=>q.id===id)).length} câu)</option>`).join('');

  app.innerHTML = `
  <div class="nav-tabs">
    <button class="nav-tab" onclick="renderHome()">📚 Ôn tập</button>
    <button class="nav-tab active" onclick="renderExamSetup()">🎯 Thi thử</button>
    <button class="nav-tab" onclick="renderNotesView()">📝 Ghi chú</button>
  </div>
  <div class="exam-setup">
    <h2>🎯 Thi thử</h2>
    <div class="form-group">
      <label>Chương</label>
      <select id="examChapter">${chapterOpts}</select>
    </div>
    <div class="form-group">
      <label>Số câu</label>
      <input type="number" id="examCount" value="30" min="5" max="430">
    </div>
    <div class="form-group">
      <label>Thời gian (phút, 0 = không giới hạn)</label>
      <input type="number" id="examTime" value="45" min="0" max="180">
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px">
      <button class="btn btn-primary" onclick="startExam()">🚀 Bắt đầu thi</button>
      <button class="btn btn-secondary" onclick="renderHome()">← Quay lại</button>
    </div>
  </div>`;
}

function startExam() {
  const chapterId = parseInt(document.getElementById('examChapter').value);
  const count = Math.max(1, parseInt(document.getElementById('examCount').value)||30);
  const minutes = parseInt(document.getElementById('examTime').value)||0;

  const allIds = chapterQuestions(chapterId, 'all');
  const picked = shuffleArray(allIds).slice(0, Math.min(count, allIds.length));

  state.examQuestions = picked.map(id => {
    const q = getQ(id);
    return { id, shuffledOpts: getShuffledOpts(q) };
  });
  state.examAnswers = {};
  state.examDuration = minutes * 60;
  state.examTime = state.examDuration;
  state.mode = 'exam';
  state.qIdx = 0;

  if (state.examTimer) clearInterval(state.examTimer);
  if (minutes > 0) {
    state.examTimer = setInterval(() => {
      state.examTime--;
      const badge = document.getElementById('timerBadge');
      if (badge) {
        const m = Math.floor(state.examTime/60), s = state.examTime%60;
        badge.textContent = `${m}:${s.toString().padStart(2,'0')}`;
        badge.className = 'timer-badge' + (state.examTime < 60 ? ' urgent' : '');
      }
      if (state.examTime <= 0) { clearInterval(state.examTimer); submitExam(); }
    }, 1000);
  }
  renderExam();
}

function renderExam() {
  const eq = state.examQuestions[state.qIdx];
  const q = getQ(eq.id);
  const total = state.examQuestions.length;
  const answered = Object.keys(state.examAnswers).length;
  const letters = ['A','B','C','D'];

  let timerHtml = '';
  if (state.examDuration > 0) {
    const m = Math.floor(state.examTime/60), s = state.examTime%60;
    timerHtml = `<div class="timer-badge" id="timerBadge">${m}:${s.toString().padStart(2,'0')}</div>`;
  }

  let html = `
  <div class="quiz-header">
    <div class="quiz-info">Câu <b>${state.qIdx+1}</b>/${total} &nbsp;·&nbsp; Đã trả lời: <b>${answered}</b>/${total}</div>
    <div style="display:flex;gap:8px;align-items:center">
      ${timerHtml}
      <button class="btn btn-danger btn-sm" onclick="if(confirm('Nộp bài?'))submitExam()">Nộp bài</button>
    </div>
  </div>

  <div class="progress-bar"><div class="progress-bar-fill" style="width:${(state.qIdx+1)/total*100}%"></div></div>

  <div class="question-card">
    <div class="q-num">CÂU ${q.id} / 430</div>
    <div class="q-text">${q.q}</div>
    <div class="options" id="optList">`;

  const selected = state.examAnswers[eq.id];
  eq.shuffledOpts.forEach((opt, i) => {
    const isSelected = selected === i;
    html += `<div class="option ${isSelected?'correct':''}" style="${isSelected?'':'opacity:0.9'}" onclick="examSelect(${i})">
      <span class="opt-letter" style="${isSelected?'background:var(--accent);color:#fff':''}">
        ${letters[i]}${isSelected?' ✓':''}
      </span>
      <span>${opt.text}</span>
    </div>`;
  });

  html += `</div></div>
  <div class="quiz-actions">
    <button class="btn btn-secondary" onclick="examNav(-1)" ${state.qIdx===0?'disabled':''}>← Trước</button>
    <button class="btn btn-primary" onclick="examNav(1)" ${state.qIdx===total-1?'disabled':''}>Tiếp →</button>
  </div>

  <div style="margin-top:20px">
    <div style="font-size:13px;color:var(--muted);margin-bottom:10px;font-weight:600">BẢNG CÂU HỎI</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px">`;

  state.examQuestions.forEach((eq2, i) => {
    const isAns = state.examAnswers[eq2.id] !== undefined;
    const isCur = i === state.qIdx;
    html += `<button onclick="state.qIdx=${i};renderExam()" style="
      width:34px;height:34px;border-radius:7px;border:1.5px solid ${isCur?'var(--accent)':isAns?'var(--green)':'var(--border)'};
      background:${isCur?'var(--accent)':isAns?'rgba(34,211,165,.15)':'var(--surface2)'};
      color:${isCur?'#fff':isAns?'var(--green)':'var(--muted)'};
      font-size:11px;font-weight:700;cursor:pointer;font-family:Space Mono,monospace">${i+1}</button>`;
  });

  html += `</div></div>`;
  app.innerHTML = html;
}

function examSelect(i) {
  const eq = state.examQuestions[state.qIdx];
  state.examAnswers[eq.id] = i;
  renderExam();
}

function examNav(dir) {
  state.qIdx = Math.max(0, Math.min(state.examQuestions.length-1, state.qIdx+dir));
  renderExam();
}

function submitExam() {
  if (state.examTimer) { clearInterval(state.examTimer); state.examTimer=null; }
  let correct=0, wrong=0, unanswered=0;
  const details = [];

  state.examQuestions.forEach(eq => {
    const q = getQ(eq.id);
    const selectedShuffled = state.examAnswers[eq.id];
    if (selectedShuffled === undefined) {
      unanswered++;
      details.push({q, eq, selectedOrig:null, correctOrig:q.a, isCorrect:false});
    } else {
      const selectedOrig = eq.shuffledOpts[selectedShuffled].origIdx;
      const isCorrect = selectedOrig === q.a;
      if (isCorrect) correct++;
      else wrong++;
      details.push({q, eq, selectedOrig, correctOrig:q.a, isCorrect});
    }
  });

  const total = state.examQuestions.length;
  const score = Math.round(correct/total*10*10)/10;
  const pct = Math.round(correct/total*100);
  const pass = pct >= 50;
  state.mode = 'examResult';
  renderExamResult({correct, wrong, unanswered, total, score, pct, pass, details});
}

function renderExamResult({correct,wrong,unanswered,total,score,pct,pass,details}) {
  const letters = ['A','B','C','D'];
  let html = `
  <div class="result-card">
    <div class="result-score ${pass?'pass':'fail'}">${score}/10</div>
    <div class="result-label">${pass?'🎉 Đạt yêu cầu!':'📚 Cần ôn thêm!'} — ${pct}% đúng</div>
    <div class="result-stats">
      <div class="stat"><b style="color:var(--green)">${correct}</b><span>Đúng</span></div>
      <div class="stat"><b style="color:var(--red)">${wrong}</b><span>Sai</span></div>
      <div class="stat"><b style="color:var(--muted)">${unanswered}</b><span>Bỏ qua</span></div>
      <div class="stat"><b>${total}</b><span>Tổng</span></div>
    </div>
  </div>
  <div class="action-row">
    <button class="btn btn-primary" onclick="renderExamSetup()">🔄 Thi lại</button>
    <button class="btn btn-secondary" onclick="renderHome()">← Về trang chủ</button>
  </div>
  <div style="font-size:14px;font-weight:700;color:var(--muted);margin-bottom:12px">PHÂN TÍCH ĐÁP ÁN</div>`;

  details.forEach((d, i) => {
    const correctLetter = letters[d.eq.shuffledOpts.findIndex(o=>o.origIdx===d.correctOrig)];
    const correctText = d.q.o[d.correctOrig];
    let selectedInfo = '';
    if (d.selectedOrig !== null) {
      const selLetter = letters[d.eq.shuffledOpts.findIndex(o=>o.origIdx===d.selectedOrig)];
      const selText = d.q.o[d.selectedOrig];
      if (!d.isCorrect) selectedInfo = `<div style="font-size:12px;color:var(--red);margin-top:5px">❌ Bạn chọn: ${selLetter}. ${selText}</div>`;
    } else {
      selectedInfo = `<div style="font-size:12px;color:var(--muted);margin-top:5px">— Không trả lời</div>`;
    }

    const examExplainHtml = d.q.e ? `<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);line-height:1.6">${d.q.e}</div>` : '';
    html += `<div style="background:var(--surface);border:1.5px solid ${d.isCorrect?'var(--border)':'var(--red)'};border-radius:12px;padding:14px 16px;margin-bottom:10px">
      <div style="font-size:11px;color:${d.isCorrect?'var(--green)':'var(--red)'};font-weight:700;margin-bottom:6px">${d.isCorrect?'✅':'❌'} Câu ${d.q.id}</div>
      <div style="font-size:14px;font-weight:600;line-height:1.5;margin-bottom:8px">${d.q.q}</div>
      <div style="font-size:13px;color:var(--green)">✔ Đáp án đúng: <b>${correctLetter}. ${correctText}</b></div>
      ${selectedInfo}${examExplainHtml}
    </div>`;
  });

  app.innerHTML = html;
  updateHeader();
}

// ============================================================
// RESET
// ============================================================
function resetAllProgress() {
  if (!confirm('⚠️ Xóa toàn bộ tiến độ (đúng/sai) và vị trí đang học của tất cả các chương? Không thể hoàn tác!')) return;

  // 1. Xóa sạch bộ nhớ trên biến tạm
  state.progress = {};
  state.sessions = {}; // QUAN TRỌNG: Xóa sạch các vị trí đang học dở
  state.queue = [];
  state.qIdx = 0;

  // 2. Ghi đè bộ nhớ rỗng xuống LocalStorage
  try {
    localStorage.setItem(STATE_KEY, JSON.stringify({
      progress: {},
      sessions: {},
      chapterId: 0,
      filter: 'all',
      isShuffled: false
    }));
  } catch(e){}

  showToast('Đã khôi phục cài đặt gốc toàn bộ!');
  renderHome(); // Quay về trang chủ
}

// ============================================================
// INIT
// ============================================================
renderHome();
</script>
